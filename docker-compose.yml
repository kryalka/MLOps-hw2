
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - mlops
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    restart: on-failure
    depends_on:
      - zookeeper
    networks:
      - mlops
    ports:
      - "127.0.0.1:9096:9095"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mlops
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic transactions \
          --partitions 1 \
          --replication-factor 1

        kafka-topics \
          --bootstrap-server kafka:9092 \
          --list

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: on-failure
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    networks:
      - mlops
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: fraud
      CLICKHOUSE_USER: hw2
      CLICKHOUSE_PASSWORD: hw2_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT throwIf(count() != 3) FROM system.tables WHERE database = 'fraud'
          AND name IN ('mv_transactions_base', 'mv_transactions_optimized', 'mv_max_transaction')"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  producer:
    profiles:
      - send
    build:
      context: .
      dockerfile: producer/Dockerfile
    networks:
      - mlops
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

networks:
  mlops:
    driver: bridge

volumes:
  clickhouse_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
